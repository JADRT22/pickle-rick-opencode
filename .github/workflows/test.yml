name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Engine and adapter tests
        run: node --experimental-strip-types --test test/core.test.ts test/adapter.test.ts
      - name: Installer syntax
        run: sh -n install.sh
